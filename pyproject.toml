[project]
name = "turnstile"
version = "0.1.0"
description = "A policy, audit and budget gateway for Model Context Protocol tool calls"
readme = "README.md"
authors = [{ name = "Lekhraj Kasar", email = "kasarlekhraj@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.0",
]

[project.scripts]
turnstile = "turnstile.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile"]

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
mypy_path = "src"
packages = ["turnstile"]
python_version = "3.12"
strict = true
